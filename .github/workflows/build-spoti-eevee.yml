name: Build Chroma + Eevee

on:
  workflow_dispatch:
    inputs:
      spotify_version:
        description: "Spotify version label (auto = detect from IPA; any version allowed)"
        required: true
        default: "auto"
        type: string
      chroma_version:
        description: "Chroma release: latest, beta, or a tag like v0.50.0"
        required: true
        default: "latest"
        type: string
      ipa_url:
        description: "Direct URL to decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Eevee fork
        uses: actions/checkout@v4
        with:
          path: eevee
          submodules: recursive

      - uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: spotify_version,chroma_version,upload_method

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3.0"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

          ARCH=$(uname -m)
          [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL \
            "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
            -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Download Spotify IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          REQUESTED_VERSION: ${{ inputs.spotify_version }}
        run: |
          curl -fsSL --retry 3 "$IPA_URL" -o spotify.ipa
          case "$(file --mime-type -b spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::Downloaded file is not an IPA"; exit 1 ;;
          esac

          VERSION=$(unzip -p spotify.ipa 'Payload/*.app/Info.plist' 2>/dev/null \
            | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || true)
          [ -n "$VERSION" ] || { echo "::error::Could not detect Spotify version"; exit 1; }
          echo "Spotify version: $VERSION"

          if [ "$REQUESTED_VERSION" != "auto" ] && [ "$VERSION" != "$REQUESTED_VERSION" ]; then
            echo "::error::Requested Spotify $REQUESTED_VERSION; IPA contains '$VERSION'"
            exit 1
          fi

          echo "SPOTIFY_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download Chroma patch kit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.chroma_version }}
        run: |
          REPO="skopevoj/spoti.pw"
          TAG=$(gh api "repos/$REPO/releases?per_page=100" | jq -r --arg v "$VERSION" '
            [.[] | select((.draft | not) and any(.assets[]; .name | endswith("-kit.zip")))]
            | if $v == "latest" then map(select(.prerelease | not))
              elif $v == "beta" then .
              else map(select(.tag_name == "v" + ($v | ltrimstr("v")))) end
            | first.tag_name // empty')

          [ -n "$TAG" ] || { echo "::error::$REPO has no Chroma release '$VERSION' with a patch kit"; exit 1; }
          echo "Using Chroma $TAG"
          echo "CHROMA_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHROMA_VERSION=${TAG#v}" >> "$GITHUB_ENV"

          gh release download "$TAG" -R "$REPO" -p '*-kit.zip' -O chroma-kit.zip
          curl -fsSL --retry 3 -o patcher.mjs https://chroma.pw/patcher.mjs

      - name: Patch Spotify with Chroma
        run: |
          rm -rf chroma-out
          node patcher.mjs spotify.ipa chroma-kit.zip chroma-out

          CHROMA_IPA=$(find chroma-out -maxdepth 1 -type f -name '*.ipa' | head -1)
          [ -n "$CHROMA_IPA" ] || { echo "::error::Chroma patcher did not produce an IPA"; exit 1; }
          echo "CHROMA_IPA=$GITHUB_WORKSPACE/$CHROMA_IPA" >> "$GITHUB_ENV"
          ls -lh "$CHROMA_IPA"

      - name: Build EeveeSwiftProtobuf.framework
        working-directory: eevee
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build Eevee .deb
        working-directory: eevee
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name 'com.eevee.spotify_*.deb' | head -1)
          [ -n "$DEB_PATH" ] || { echo "::error::Eevee .deb not produced"; exit 1; }
          echo "EEVEE_DEB=$GITHUB_WORKSPACE/eevee/$DEB_PATH" >> "$GITHUB_ENV"

      - name: Build Eevee sideload shim
        working-directory: eevee
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh
          test -f packages/zxPluginsInject.dylib
          echo "ZXPI_DYLIB=$GITHUB_WORKSPACE/eevee/packages/zxPluginsInject.dylib" >> "$GITHUB_ENV"

      - name: Inject Eevee into Chroma IPA
        run: |
          EXTRACT="$RUNNER_TEMP/eevee-deb"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          dpkg-deb -R "$EEVEE_DEB" "$EXTRACT"

          DYLIB=$(find "$EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE=$(find "$EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          [ -n "$DYLIB" ] || { echo "::error::EeveeSpotify.dylib missing"; exit 1; }

          INJECT=("$DYLIB")
          [ -n "$FRAMEWORK" ] && INJECT+=("$FRAMEWORK")
          [ -n "$BUNDLE" ] && INJECT+=("$BUNDLE")

          mkdir -p output
          OUT="$GITHUB_WORKSPACE/output/Spotify-${SPOTIFY_VERSION}-Chroma-${CHROMA_VERSION}-Eevee.ipa"

          # Keep Chroma's extensions intact. In particular, do not use -u/-du
          # and do not run Eevee's strip-ipa.sh after Chroma has patched the IPA.
          cyan -i "$CHROMA_IPA" -o "$OUT" -f "${INJECT[@]}" -c 9 -m 15.0 -s --overwrite

          echo "FINAL_IPA=$OUT" >> "$GITHUB_ENV"

      - name: LC-inject Eevee sideload shim
        run: |
          ipapatch --input "$FINAL_IPA" --inplace --noconfirm \
            --dylib "$ZXPI_DYLIB"

      - name: Verify combined IPA
        run: |
          unzip -l "$FINAL_IPA" | grep -q 'EeveeSpotify.dylib' || {
            echo "::error::EeveeSpotify.dylib not present in final IPA"
            exit 1
          }

          unzip -l "$FINAL_IPA" | grep -q 'zxPluginsInject.dylib' || {
            echo "::error::zxPluginsInject.dylib not present in final IPA"
            exit 1
          }

          unzip -l "$FINAL_IPA" | grep -q 'SpotifyGlassLiveActivity.appex' || {
            echo "::warning::Chroma Live Activity extension not found in final IPA"
          }

          echo "Combined IPA:"
          ls -lh "$FINAL_IPA"

      - name: Upload artifact
        if: ${{ inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' }}
        uses: actions/upload-artifact@v7
        with:
          name: Spotify-Chroma-${{ env.CHROMA_VERSION }}-Eevee
          path: ${{ env.FINAL_IPA }}
          archive: false
          if-no-files-found: error

      - name: Upload to filebin.net
        if: ${{ inputs.upload_method == 'filebin' || inputs.upload_method == 'both' }}
        run: |
          BIN="chroma-eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          NAME=$(basename "$FINAL_IPA")
          curl -fsS -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FINAL_IPA" \
            "https://filebin.net/$BIN/$NAME" >/dev/null

          {
            echo "### filebin.net download"
            echo "- https://filebin.net/$BIN/$NAME"
          } >> "$GITHUB_STEP_SUMMARY"
