name: Build spoti.pw 0.22 + Eevee

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to decrypted Spotify 9.1.78 IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Eevee fork
        uses: actions/checkout@v4
        with:
          path: eevee
          submodules: recursive

      - name: Checkout spoti.pw v0.22.0
        uses: actions/checkout@v4
        with:
          repository: skopevoj/spoti.pw
          ref: v0.22.0
          path: spoti
          submodules: recursive

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify IPA
        run: |
          mkdir -p spoti/ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o spoti/ipa/spotify.ipa
          case "$(file --mime-type -b spoti/ipa/spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::Downloaded file is not an IPA"; exit 1 ;;
          esac

          VERSION=$(unzip -p spoti/ipa/spotify.ipa 'Payload/*.app/Info.plist' 2>/dev/null \
            | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || true)
          echo "Spotify version: $VERSION"
          [ "$VERSION" = "9.1.78" ] || {
            echo "::error::spoti.pw v0.22.0 expects Spotify 9.1.78; got '$VERSION'"
            exit 1
          }

      - name: Build spoti.pw v0.22.0
        working-directory: spoti
        run: |
          make release
          test -f out/spoti.pw-0.22.0.ipa
          echo "SPOTI_IPA=$GITHUB_WORKSPACE/spoti/out/spoti.pw-0.22.0.ipa" >> "$GITHUB_ENV"

      - name: Build EeveeSwiftProtobuf.framework
        working-directory: eevee
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build Eevee .deb
        working-directory: eevee
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name 'com.eevee.spotify_*.deb' | head -1)
          [ -n "$DEB_PATH" ] || { echo "::error::Eevee .deb not produced"; exit 1; }
          echo "EEVEE_DEB=$GITHUB_WORKSPACE/eevee/$DEB_PATH" >> "$GITHUB_ENV"

      - name: Inject Eevee into spoti.pw IPA
        run: |
          EXTRACT="$RUNNER_TEMP/eevee-deb"
          mkdir -p "$EXTRACT"
          dpkg-deb -R "$EEVEE_DEB" "$EXTRACT"

          DYLIB=$(find "$EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE=$(find "$EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          [ -n "$DYLIB" ] || { echo "::error::EeveeSpotify.dylib missing"; exit 1; }

          INJECT=("$DYLIB")
          [ -n "$FRAMEWORK" ] && INJECT+=("$FRAMEWORK")
          [ -n "$BUNDLE" ] && INJECT+=("$BUNDLE")

          mkdir -p output
          OUT="$GITHUB_WORKSPACE/output/Spotify-9.1.78-spoti.pw-0.22.0-Eevee.ipa"

          # Do not use -u/-du and do not run Eevee's strip-ipa.sh.
          # Those remove extensions that spoti.pw needs for widgets/Live Activity.
          cyan -i "$SPOTI_IPA" -o "$OUT" -f "${INJECT[@]}" -c 9 -m 15.0 -s --overwrite

          echo "FINAL_IPA=$OUT" >> "$GITHUB_ENV"

      - name: Verify combined IPA
        run: |
          unzip -l "$FINAL_IPA" | grep -q 'EeveeSpotify.dylib' || {
            echo "::error::Eevee dylib not present in final IPA"
            exit 1
          }

          unzip -l "$FINAL_IPA" | grep -q 'SpotifyGlassLiveActivity.appex' || {
            echo "::warning::SpotifyGlassLiveActivity.appex not found; build may lack Live Activity"
          }

          echo "Combined IPA:"
          ls -lh "$FINAL_IPA"

      - name: Upload artifact
        if: ${{ inputs.upload_method == 'artifacts' || inputs.upload_method == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-spoti.pw-0.22.0-Eevee
          path: ${{ env.FINAL_IPA }}
          if-no-files-found: error

      - name: Upload to filebin.net
        if: ${{ inputs.upload_method == 'filebin' || inputs.upload_method == 'both' }}
        run: |
          BIN="spoti-eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          NAME=$(basename "$FINAL_IPA")
          curl -fsS -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FINAL_IPA" \
            "https://filebin.net/$BIN/$NAME" >/dev/null

          {
            echo "### filebin.net download"
            echo "- https://filebin.net/$BIN/$NAME"
          } >> "$GITHUB_STEP_SUMMARY"
